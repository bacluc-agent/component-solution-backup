name: Autorelease
# Not pull_request: that gives fork PRs a read-only GITHUB_TOKEN, and this job
# writes through the API. This job never checks out or runs code from the PR,
# only reads its metadata from the event payload.
on:
  pull_request_target:
    types:
      - synchronize
      - labeled
      - unlabeled
      - closed

permissions:
  contents: write
  pull-requests: write # PR comments are checked against this, not issues
  actions: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create new tag
        uses: projectsyn/pr-label-tag-action@v1
        with:
          trigger: |
            Release
